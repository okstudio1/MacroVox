<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Defense-in-depth CSP. Tauri's runtime CSP (tauri.conf.json) is the
       authoritative one; this meta tag protects the same origin if the app is
       ever loaded in a plain browser (e.g. Vite dev server) where the runtime
       CSP doesn't apply. style-src needs 'unsafe-inline' because Tailwind /
       lucide-react inject style attributes at runtime. -->
  <title>MacroVox — Dictation</title>
  <style>
    body { margin: 0; background: #0a0f14; overflow: hidden; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="./dictation.tsx"></script>
</body>
</html>
