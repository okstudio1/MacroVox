[package]
name = "macrovox"
version = "1.0.9"
edition = "2021"
description = "MacroVox — Real-time voice dictation with AI cleanup"
authors = ["OK Studio"]
license = "MIT"

[package.metadata.bundle]
identifier = "com.okstudio.macrovox"
icon = ["icons/icon.ico", "icons/icon.png"]

[lib]
name = "macrovox_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Phase 3: native WASAPI audio capture (replaces ffmpeg subprocess)
cpal = "0.15"
# HTTP client for Deepgram pre-recorded API in recording_stop
reqwest = { version = "0.12", features = ["json"] }

# URL-encode keyword boost parameters for Deepgram API
urlencoding = "2"

# Phase 4: Deepgram WebSocket streaming (pre-warmed real-time STT)
tokio-tungstenite = { version = "0.21", features = ["native-tls"] }
futures-util = "0.3"
tokio = { version = "1", features = ["sync", "macros", "rt", "time", "io-util", "net"] }

# Phase 4: local STT option (off by default — requires cmake + model download)
# Enable with: cargo build --features local-stt
whisper-rs = { version = "0.10", optional = true }

# Phase 5: replace PowerShell SendKeys paste (~700ms) with native input
enigo = "0.2"

# Voice buffer: timestamps, base64 for playback, Opus compression
chrono = "0.4"
base64 = "0.22"
ogg-opus = "0.1"

# Auto-updater + process relaunch
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Debug logging (activate with RUST_LOG=debug)
log = "0.4"
env_logger = "0.11"

[features]
default = []
local-stt = ["dep:whisper-rs"]
