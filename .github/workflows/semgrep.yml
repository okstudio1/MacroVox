name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read source only. Semgrep does not need to write to the repo.
permissions:
  contents: read

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: SAST
    runs-on: ubuntu-latest
    # Dependabot PRs don't have repo-secret access; skip rather than fail.
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      # Pin to the version the local audit tooling runs (see the
      # 2026-05-10 audit summary). Bump in lockstep with the local pin.
      - run: pip install semgrep==1.162.0

      # Matches the local pack set. Fails the build only on ERROR-severity
      # findings (the high-signal subset). Warnings + info still print in
      # the log for review but don't gate.
      - run: |
          semgrep scan \
            --config p/security-audit \
            --config p/secrets \
            --config p/javascript \
            --config p/typescript \
            --config p/rust \
            --config p/nodejs \
            --severity ERROR \
            --error \
            --metrics off
