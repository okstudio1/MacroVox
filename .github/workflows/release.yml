name: Release

# Tag-triggered Linux build. Publishing is local — alpha-osk pattern.
#
# Trigger: push a tag matching v*.*.* (e.g. v1.0.7). The workflow builds
# the Linux bundle, generates a Linux-only updater manifest, and uploads
# both as a workflow artifact named `linux-bundle`. Nothing is published
# to GitHub Releases from CI.
#
# Owen then, on the EV-cert host:
#   1. Downloads the `linux-bundle` artifact for the tag.
#   2. Builds Windows locally (tauri build with signCommand → EV-signed).
#   3. Regenerates latest.json locally so it covers both platforms.
#   4. Runs `gh release create v1.0.7 --repo okstudio1/macrovox-releases
#      --draft <files>` from the local machine. Owen's gh auth has
#      write access to both repos, so no PAT or workflow secret is
#      needed for cross-repo publishing.
#   5. Walks docs/RELEASE_CHECKLIST.md, then publishes the draft.
#
# Why no Windows job in CI: the EV Authenticode cert lives on a hardware
# token on Owen's local machine. The correct order is build → EV-sign →
# minisign; splitting that across CI + local would invalidate one of
# the signatures.
#
# Why no CI publish: source repo (okstudio1/MacroVox) is private and the
# default GITHUB_TOKEN can't write to other repos. Cross-repo publishing
# would require a PAT secret. Local publish avoids the secret entirely
# and matches alpha-osk's release flow.
#
# Updater signing: the .sig sidecars are produced here using the minisign
# key stored as TAURI_SIGNING_PRIVATE_KEY repo secret — same key as the
# local Windows build, so all platforms verify against the same pubkey
# baked into tauri.conf.json.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      # Tag-triggered build with access to signing secrets. Read from cache
      # if available, but never write back — a poisoned tag must not be
      # able to contaminate cache entries that subsequent main builds use.
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2.9.1
        with:
          workspaces: src-tauri
          save-if: false

      - name: Install Linux system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libgtk-3-dev \
            libasound2-dev \
            libpulse-dev

      - run: npm ci

      - name: tauri build (signed)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Stage release/linux
        run: npm run release:linux

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Generate Linux-only latest.json (Owen regenerates locally with Windows)
        run: |
          node scripts/generate-latest.mjs \
            --version "${{ steps.version.outputs.version }}" \
            --notes "MacroVox ${{ steps.version.outputs.version }} — see CHANGELOG.md"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-bundle
          path: |
            release/linux/
            release/latest.json
          if-no-files-found: error
          retention-days: 14
